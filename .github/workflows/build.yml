name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          pip install --upgrade pip
          pip install flet yt-dlp

      - name: Gerar APK
        run: |
          flet build apk --verbose

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-apk
          path: build/apk/*.apk